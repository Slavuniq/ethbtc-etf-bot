name: SUP price scan (Nice)

on:
  push:
    branches: [claude/sup-nice-scan-gnltnf]
    paths:
      - scripts/sup_scan.py
      - .github/workflows/sup-scan.yml
  workflow_dispatch:
    inputs:
      short_url:
        description: Короткая ссылка для разворачивания (напр. maps.app.goo.gl)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Resolve short link
        env:
          SHORT_URL: ${{ inputs.short_url || 'https://maps.app.goo.gl/3Ugsf87MSXqpS99r7' }}
        run: |
          echo "Разворачиваю: $SHORT_URL"
          curl -sSIL "$SHORT_URL" | grep -iE '^(location:|HTTP/)' || true

      - name: Scan stores
        run: python scripts/sup_scan.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sup-scan-results
          path: sup_scan_results.json
          if-no-files-found: warn
